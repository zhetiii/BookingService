version: '3.8'

redis:
    image: redis:alpine
    container_name: booking-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - booking-net

services:
  db:
    image: postgres:16
    container_name: booking-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - booking-net

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=booking_db;Username=postgres;Password=password
    depends_on:
      - db
    networks:
      - booking-net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=booking_db;Username=postgres;Password=password
    depends_on:
      - db
    networks:
      - booking-net

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=booking_db;Username=postgres;Password=password
    depends_on:
      - db
    networks:
      - booking-net

volumes:
  db_data:

networks:
  booking-net:
    driver: bridge
