version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CONNECTION_STRING=Host=db;Port=5432;Database=app;Username=postgres;Password=1234
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: booking_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
